name: Build Resonance APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resonance-latest-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RESONANCE_DEBUG_KEYSTORE: ${{ github.workspace }}/.ci-signing/debug.keystore
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle Wrapper for local development
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "Add Gradle wrapper for local development"
              git push origin HEAD:main || echo "::warning::Could not push wrapper files; they remain available in the workflow workspace."
            fi
          fi
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore and verify fixed Android signing identity
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.RESONANCE_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Fixed signing secret is missing. Refusing to generate a new identity."
            exit 1
          fi
          mkdir -p "$(dirname "$RESONANCE_DEBUG_KEYSTORE")"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RESONANCE_DEBUG_KEYSTORE"
          chmod 600 "$RESONANCE_DEBUG_KEYSTORE"
          keytool -exportcert -keystore "$RESONANCE_DEBUG_KEYSTORE" -storepass android \
            -alias androiddebugkey -file "$RUNNER_TEMP/resonance-signer.der" > /dev/null 2>&1
          actual="$(sha256sum "$RUNNER_TEMP/resonance-signer.der" | cut -d ' ' -f 1)"
          expected="$(tr -d '[:space:]' < signing-certificate.sha256)"
          if [ "$actual" != "$expected" ]; then
            echo "::error::Signing certificate does not match the published identity."
            exit 1
          fi
          echo "Fixed signing certificate verified: $actual"
      - name: Test, lint and assemble Android
        run: |
          gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk Resonance-latest-debug.apk
      - name: Build side-by-side preview without replacing installed data
        run: |
          gradle --no-daemon :app:assembleDebug -PresonancePreview=true
          cp app/build/outputs/apk/debug/app-debug.apk Resonance-preview-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resonance-android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
            app/build/outputs/ui-review/*.png
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-debug-apk
          path: |
            Resonance-latest-debug.apk
            Resonance-preview-debug.apk
          if-no-files-found: error

      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view latest-test >/dev/null 2>&1 || gh release create latest-test --title "Resonance 最新测试版" --notes-file docs/RELEASE_NOTES.md
          gh release upload latest-test Resonance-latest-debug.apk Resonance-preview-debug.apk --clobber
          gh release edit latest-test --notes-file docs/RELEASE_NOTES.md
      - name: Remove temporary signing material
        if: always()
        shell: bash
        run: rm -f -- "$RESONANCE_DEBUG_KEYSTORE" "$RUNNER_TEMP/resonance-signer.der"
