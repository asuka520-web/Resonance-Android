name: Build Resonance APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: resonance-latest-apk
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Generate Gradle Wrapper for local development
        shell: bash
        run: |
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            gradle --no-daemon wrapper --gradle-version 8.9 --distribution-type bin
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add gradlew gradlew.bat gradle/wrapper/gradle-wrapper.jar gradle/wrapper/gradle-wrapper.properties
            if ! git diff --cached --quiet; then
              git commit -m "Add Gradle wrapper for local development"
              git push origin HEAD:main || echo "::warning::Could not push wrapper files; they remain available in the workflow workspace."
            fi
          fi
      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          test -d "$ANDROID_HOME"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --version
      - name: Install SDK 35
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"
      - name: Restore persistent debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: resonance-debug-keystore-v1
      - name: Test, lint and assemble Android
        run: gradle --no-daemon :app:testDebugUnitTest :app:lintDebug :app:assembleDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Resonance-android-test-reports
          path: |
            app/build/test-results/testDebugUnitTest
            app/build/reports/tests/testDebugUnitTest
            app/build/reports/lint-results-debug.*
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: Resonance-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Publish direct-download APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk Resonance-latest-debug.apk
          gh release view latest-test >/dev/null 2>&1 || gh release create latest-test --title "Resonance 最新测试版" --notes "自动构建的测试 APK。注意：GitHub Actions 默认调试签名可能改变，覆盖安装如提示签名不匹配，请先备份数据，勿直接卸载。"
          gh release upload latest-test Resonance-latest-debug.apk --clobber
