name: Securely preserve existing Android signing key
on:
  workflow_dispatch:
    inputs:
      public_key:
        description: Temporary RSA public key for encrypted transfer
        required: true
        type: string
permissions:
  contents: read
jobs:
  preserve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ci-signing/debug.keystore
          key: resonance-debug-keystore-v2
          fail-on-cache-miss: true
      - name: Encrypt existing signing key for its owner
        env:
          TRANSFER_PUBLIC_KEY: ${{ inputs.public_key }}
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const crypto = require('node:crypto');
          const key = crypto.randomBytes(32);
          const nonce = crypto.randomBytes(12);
          const cipher = crypto.createCipheriv('aes-256-gcm', key, nonce);
          const plaintext = fs.readFileSync('.ci-signing/debug.keystore');
          const ciphertext = Buffer.concat([cipher.update(plaintext), cipher.final()]);
          const wrappedKey = crypto.publicEncrypt({key: process.env.TRANSFER_PUBLIC_KEY, oaepHash: 'sha256'}, key);
          fs.writeFileSync('signing-backup.enc.json', JSON.stringify({
            version: 1,
            wrappedKey: wrappedKey.toString('base64'),
            nonce: nonce.toString('base64'),
            tag: cipher.getAuthTag().toString('base64'),
            ciphertext: ciphertext.toString('base64')
          }));
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: resonance-signing-encrypted-transfer
          path: signing-backup.enc.json
          retention-days: 1
          if-no-files-found: error
